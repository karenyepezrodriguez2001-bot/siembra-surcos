<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Panel de la investigadora · Siembra hábitos</title>
<style>
:root{--g:#2f7d4f;--gl:#e8f4ec;--b:#d6e2da;--m:#5d6b62;--o:#f4a23a}*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7f5;color:#1f2a24;line-height:1.45}
header{background:#1f4d33;color:#fff;padding:14px 16px;text-align:center}header h1{margin:0;font-size:20px}header p{margin:3px 0 0;font-size:13px;opacity:.85}
main{max-width:1100px;margin:0 auto;padding:14px}
.card{background:#fff;border:1px solid var(--b);border-radius:12px;padding:16px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:17px;color:var(--g)}h3{margin:14px 0 8px;font-size:15px;color:#1f4d33}
input,select{padding:9px 10px;border:1px solid #b9c9bf;border-radius:8px;font-size:14px;font-family:inherit}
input[type=password],input[type=search]{width:100%;max-width:340px}
button{background:var(--g);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:14px;font-weight:bold;cursor:pointer;margin:4px 6px 4px 0}
button.s{background:#fff;color:var(--g);border:1px solid var(--g)}
.err{background:#fde8e8;color:#9b1c1c;padding:10px;border-radius:8px;margin-top:10px;font-size:14px}
.ok{color:var(--g);font-weight:bold;font-size:13px;margin-right:10px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.k{background:var(--gl);border-radius:10px;padding:12px;text-align:center}.k b{display:block;font-size:26px;color:var(--g)}.k span{font-size:12px;color:var(--m)}
.tw{overflow-x:auto;border:1px solid var(--b);border-radius:8px;max-height:520px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--b);padding:6px 8px;text-align:center;white-space:nowrap}th{background:var(--g);color:#fff;position:sticky;top:0}td.l{text-align:left;font-weight:bold}
tr.avg td{background:var(--gl);font-weight:bold}
.step{font-size:13px;color:var(--m);margin:2px 0 8px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;background:#fff;border-bottom:1px solid var(--b);position:sticky;top:0;z-index:5}
.tabs button{margin:0;background:#fff;color:var(--g);border:1px solid var(--b);white-space:nowrap}.tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.sub button{margin:0;background:#fff;color:#1f4d33;border:1px solid var(--b);padding:7px 12px}.sub button.on{background:var(--o);color:#fff;border-color:var(--o)}
.bar{display:grid;grid-template-columns:150px 1fr 110px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.trk{background:#eef3f0;border-radius:99px;height:14px;overflow:hidden}.trk i{display:block;height:100%;background:linear-gradient(90deg,#3d9a60,#58b273);border-radius:99px}
.go{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.go button{margin:0;text-align:left;background:var(--gl);color:#1f4d33;border:1px solid var(--b);font-weight:normal;padding:12px}.go button b{display:block;color:var(--g);margin-bottom:2px}
.bt{margin-top:12px;padding:10px;background:#f7faf8;border:1px dashed var(--b);border-radius:8px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--gl);color:var(--g)}.pill.w{background:#fdeed7;color:#8a5200}.pill.n{background:#eee;color:#666}
.res{background:var(--gl);border-radius:8px;padding:10px;margin:10px 0}
@media(max-width:600px){.bar{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Panel de la investigadora</h1><p>Campaña “Siembra hábitos, cosecha salud” · acceso privado</p></header>
<div id="nav"></div>
<main id="app"></main>
<script>
const URL="https://vokpjjidytayjrzjespr.supabase.co",KEY="sb_publishable_q6YCquh7-JYBEUrl1UCQfA_NDJ5ROGS";
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s),app=$("#app"),nav=$("#nav");
let CLAVE="",F=[],SEM=[],GEN="",TAB="inicio",SUB="",BUSCA="",RW=1,RP=true;
const KQ=["B","B","B","A","C","B","B","C","A","B"]; // clave supuesta; verificar con la tabla "clave" de Supabase
async function rpc(fn,a){let r;try{r=await fetch(`${URL}/rest/v1/rpc/${fn}`,{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY},body:JSON.stringify(a)})}catch(e){throw new Error("Sin conexión")}
 const t=await r.text();let d;try{d=JSON.parse(t)}catch(e){d=t}if(!r.ok)throw new Error((d&&d.message)||"Error");return d}
function login(m){nav.innerHTML="";app.innerHTML=`<div class="card"><h2>Ingreso</h2><p class="step">Escriba la clave que definió al crear el panel.</p><input id="k" type="password" placeholder="Clave" autocomplete="current-password"> <button id="bk" onclick="entrar()">Entrar</button>${m?`<div class="err">${esc(m)}</div>`:""}</div>`;$("#k").addEventListener("keydown",e=>{if(e.key=="Enter")entrar()})}
async function entrar(){CLAVE=$("#k").value;const b=$("#bk");b.disabled=true;b.textContent="Verificando…";await cargar(true)}
async function cargar(primera){try{const d=await rpc("admin_exportar",{p_clave:CLAVE});F=d.filas||[];GEN=d.generado;await semanas();if(primera){TAB="inicio";SUB="";BUSCA=""}render()}catch(e){login(e.message)}}
const hoy=()=>new Date().toLocaleDateString("en-CA",{timeZone:"America/Guayaquil"});
async function semanas(){try{const r=await fetch(`${URL}/rest/v1/semanas?select=numero,titulo,fecha_apertura,fecha_cierre&order=numero`,{headers:{apikey:KEY}});SEM=await r.json();RW=Math.max(1,SEM.filter(x=>x.fecha_apertura<=hoy()).reduce((a,x)=>Math.max(a,x.numero),1))}catch(e){SEM=[]}}
function salirP(){CLAVE="";F=[];login()}

/* ---------- utilidades de datos ---------- */
const tx=v=>v==null?"":String(v).replace(/[\t\r\n]+/g," ");
const prog=(f,s)=>(f.progreso||[]).find(x=>x.s==s)||{};
const hab=(f,s)=>((f.habitos||[]).find(x=>x.s==s)||{}).v;
const sc=a=>a?a.reduce((n,x,i)=>n+(String(x).toUpperCase()==KQ[i]?1:0),0):null;
const nv=p=>p==null?"":p<=4?"Bajo":p<=7?"Medio":"Alto";
const avg=a=>{a=a.filter(x=>x!=null&&x!==""&&!isNaN(x));return a.length?(a.reduce((s,x)=>s+ +x,0)/a.length).toFixed(1):"–"};
const dash=v=>v==null||v===""?"–":v;
const nhab=f=>[1,2,3,4].filter(s=>hab(f,s)).length;
const elig=f=>!!(f.pre&&f.post&&f.sat&&nhab(f)>=3);
const fecha=d=>d?new Date(d).toLocaleDateString("es-EC"):"–";
const flt=()=>{const q=BUSCA.trim().toLowerCase();return q?F.filter(f=>((f.codigo||"")+" "+(f.nombre||"")).toLowerCase().includes(q)):F};

/* ---------- bloques para copiar (siempre completos y en el mismo orden) ---------- */
const BL={
 part:()=>F.map(f=>[f.codigo,f.edad,f.sexo,f.parentesco,f.instruccion,f.grado,"",(f.progreso||[]).filter(x=>x.r).length]),
 contactos:()=>[["Código","Nombre","Correo","WhatsApp","Registro"]].concat(F.map(f=>[f.codigo,f.nombre,f.correo,f.whatsapp,fecha(f.registrado)])),
 pre:()=>F.map(f=>[f.codigo].concat(f.pre||Array(10).fill(""))),
 post:()=>F.map(f=>f.post||Array(10).fill("")),
 comp:()=>[["Código","Pretest","Postest","Cambio"]].concat(F.map(f=>{const a=sc(f.pre),b=sc(f.post);return[f.codigo,a==null?"":a,b==null?"":b,a!=null&&b!=null?b-a:""]})),
 hab:()=>F.map(f=>{let r=[f.codigo];for(let s=1;s<=4;s++)r=r.concat(hab(f,s)||["","","",""]);return r}),
 sat:()=>F.map(f=>[f.codigo].concat(f.sat||["","","",""]))};
function cp(k,el){const t=BL[k]().map(r=>r.map(tx).join("\t")).join("\n");const m=el.parentElement.querySelector(".ok");
 navigator.clipboard.writeText(t).then(()=>{m.textContent="Copiado ✓ ("+F.length+" filas)"}).catch(()=>{m.textContent="No se pudo copiar"})}
const cbtn=(k,txt,cls)=>`<button class="${cls||""}" onclick="cp('${k}',this)">${txt}</button><span class="ok"></span>`;

/* ---------- componentes ---------- */
const T=(h,r,vacio)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${esc(x)}</th>`).join("")}</tr>${r.map(row=>`<tr${row.avg?' class="avg"':""}>${(row.avg?row.c:row).map((c,i)=>`<td${i==0?' class="l"':""}>${c&&c.h!==undefined?c.h:esc(c)}</td>`).join("")}</tr>`).join("")||`<tr><td colspan="${h.length}">${vacio||"Aún no hay registros."}</td></tr>`}</table></div>`;
const AV=c=>({avg:1,c});
const buscador=()=>`<input id="bs" type="search" placeholder="Buscar por código o nombre…" value="${esc(BUSCA)}" oninput="BUSCA=this.value;render();const b=$('#bs');b.focus();b.setSelectionRange(b.value.length,b.value.length)">`;
const sub=l=>`<div class="sub">${l.map(x=>`<button class="${SUB==x[0]?"on":""}" onclick="SUB='${x[0]}';render()">${x[1]}</button>`).join("")}</div>`;
const TABS=[["inicio","🏠 Inicio"],["part","👥 Participantes"],["avance","📈 Avance"],["conoc","🧠 Conocimientos"],["hab","🌱 Hábitos"],["sat","⭐ Satisfacción"],["rec","🔔 Recordatorios"]];
function go(t){TAB=t;SUB={conoc:"pre",hab:"1"}[t]||"";BUSCA="";render();window.scrollTo(0,0);if(t=="rec")cargarEstado()}
function render(){
 nav.innerHTML=`<div class="tabs">${TABS.map(t=>`<button class="${TAB==t[0]?"on":""}" onclick="go('${t[0]}')">${t[1]}</button>`).join("")}<button class="s" style="margin-left:auto" onclick="cargar()">↻ Actualizar</button><button class="s" onclick="salirP()">Cerrar sesión</button></div>`;
 app.innerHTML=({inicio:vInicio,part:vPart,avance:vAvance,conoc:vConoc,hab:vHab,sat:vSat,rec:vRec})[TAB]()+`<p class="step">Datos actualizados: ${GEN?new Date(GEN).toLocaleString("es-EC"):"–"}</p>`}

/* ---------- INICIO: panorama general ---------- */
function vInicio(){const n=F.length,c=a=>F.filter(a).length,pct=x=>n?Math.round(x*100/n):0;
 const k=[["Registrados",n],["Evaluación inicial",c(f=>f.pre)],["Evaluación final",c(f=>f.post)],["Encuesta",c(f=>f.sat)],["Completaron todo",c(elig)]];
 const et=[["Registro",n],["Evaluación inicial",c(f=>f.pre)],["Hábitos S1",c(f=>hab(f,1))],["Hábitos S2",c(f=>hab(f,2))],["Hábitos S3",c(f=>hab(f,3))],["Hábitos S4",c(f=>hab(f,4))],["Evaluación final",c(f=>f.post)],["Encuesta",c(f=>f.sat)]];
 const h=hoy(),est=s=>h<s.fecha_apertura?{h:'<span class="pill n">Próxima</span>'}:h>s.fecha_cierre?{h:'<span class="pill">Cerrada</span>'}:{h:'<span class="pill w">Abierta ahora</span>'};
 return `<div class="card"><h2>Panorama general</h2><div class="kp">${k.map(x=>`<div class="k"><b>${x[1]}</b><span>${x[0]}</span></div>`).join("")}</div></div>
 <div class="card"><h2>Avance de la campaña</h2><p class="step">Porcentaje sobre el total de registrados.</p>${et.map(x=>`<div class="bar"><span>${x[0]}</span><div class="trk"><i style="width:${pct(x[1])}%"></i></div><b>${x[1]} (${pct(x[1])}%)</b></div>`).join("")}</div>
 <div class="card"><h2>Calendario</h2>${T(["Semana","Tema","Abre","Cierra","Estado"],SEM.map(s=>[s.numero,s.titulo,s.fecha_apertura,s.fecha_cierre,est(s)]),"No se pudieron cargar las semanas.")}</div>
 <div class="card"><h2>Secciones del panel</h2><div class="go">
 <button onclick="go('part')"><b>👥 Participantes</b>Quiénes se registraron y sus datos.</button>
 <button onclick="go('avance')"><b>📈 Avance</b>Qué ha hecho cada familia.</button>
 <button onclick="go('conoc')"><b>🧠 Conocimientos</b>Evaluación inicial, final y comparación.</button>
 <button onclick="go('hab')"><b>🌱 Hábitos</b>Registro semanal, semana por semana.</button>
 <button onclick="go('sat')"><b>⭐ Satisfacción</b>Resultados de la encuesta.</button>
 <button onclick="go('rec')"><b>🔔 Recordatorios</b>Mensajes a las familias pendientes.</button></div>
 <p class="step">Cada sección tiene su botón “Copiar” con las instrucciones de dónde pegar en el Excel de tabulación.</p></div>`}

/* ---------- PARTICIPANTES ---------- */
function vPart(){const L=flt();
 return `<div class="card"><h2>Participantes (${F.length})</h2>${buscador()}<p class="step">Mostrando ${L.length} de ${F.length}.</p>
 ${T(["Código","Nombre","Edad","Sexo","Parentesco","Instrucción","Grado","Registro","Retos","Correo","WhatsApp"],L.map(f=>[f.codigo,dash(f.nombre),dash(f.edad),dash(f.sexo),dash(f.parentesco),dash(f.instruccion),dash(f.grado),fecha(f.registrado),(f.progreso||[]).filter(x=>x.r).length,dash(f.correo),dash(f.whatsapp)]))}
 <div class="bt"><b>Para el Excel de la tesis</b> (solo código, sin nombre)<br>${cbtn("part","Copiar participantes")}<p class="step">Hoja de Participantes, celda <b>A6</b>. Incluye todos los registrados, aunque haya filtrado la tabla. La columna “Asistencia a la charla” sale vacía: complétela a mano con la lista de la sesión en vivo.</p></div>
 <div class="bt"><b>Contactos</b> (incluye nombre, correo y WhatsApp; no pegar en el Excel de la tesis)<br>${cbtn("contactos","Copiar contactos","s")}</div></div>`}

/* ---------- AVANCE ---------- */
function vAvance(){const L=flt(),m=(f,s)=>{const p=prog(f,s);return[p.l,p.r,hab(f,s)].filter(Boolean).length+"/3"};
 return `<div class="card"><h2>Avance por participante</h2>${buscador()}
 <p class="step">Cada semana muestra cuántas de 3 cosas hizo: lección vista, reto completado y hábitos enviados. El certificado se habilita con evaluación inicial, hábitos en 3 de 4 semanas, evaluación final y encuesta.</p>
 ${T(["Código","Nombre","Inicial","S1","S2","S3","S4","Final","Encuesta","Certificado"],L.map(f=>[f.codigo,dash(f.nombre),f.pre?"✓":"–",m(f,1),m(f,2),m(f,3),m(f,4),f.post?"✓":"–",f.sat?"✓":"–",elig(f)?"✓":"–"]))}
 <h3>Resumen por semana</h3>${T(["Semana","Lección vista","Reto completado","Hábitos enviados"],[1,2,3,4].map(s=>[s,F.filter(f=>prog(f,s).l).length,F.filter(f=>prog(f,s).r).length,F.filter(f=>hab(f,s)).length]))}</div>`}

/* ---------- CONOCIMIENTOS ---------- */
function vConoc(){const L=flt(),H=["Código"].concat(Array.from({length:10},(_,i)=>"P"+(i+1))),
 nota=`<p class="step">Se muestra la letra elegida en cada pregunta. El puntaje y el nivel (Bajo 0–4, Medio 5–7, Alto 8–10) se calculan aquí con la clave de respuestas; verifique que coincida con la tabla <b>clave</b> de Supabase.</p>`;
 let b="";
 if(SUB=="pre"||SUB=="post"){const k=SUB,lab=k=="pre"?"Evaluación inicial":"Evaluación final",rows=a=>a.map(f=>{const r=f[k],p=sc(r);return[f.codigo].concat(r||Array(10).fill("–"),[dash(p),dash(nv(p))])});
  const ps=F.map(f=>sc(f[k])).filter(x=>x!=null);
  b=`<h3>${lab}</h3>${buscador()}${nota}${T(H.concat(["Puntaje","Nivel"]),rows(L).concat(ps.length?[AV(["Promedio ("+ps.length+")"].concat(Array(10).fill(""),[avg(ps),""]))]:[]))}
  <div class="bt">${cbtn(k,"Copiar "+lab.toLowerCase())}<p class="step">${k=="pre"?"Hoja de Conocimientos, celda <b>A6</b> (código + 10 respuestas).":"Hoja de Conocimientos, celda <b>N6</b> (10 respuestas, sin código)."} Incluye a todos en el mismo orden de participantes.</p></div>`}
 else{const rows=L.map(f=>{const a=sc(f.pre),p=sc(f.post);return[f.codigo,dash(a),dash(p),a!=null&&p!=null?(p-a>0?"+":"")+(p-a):"–"]}),
  par=F.filter(f=>f.pre&&f.post),dif=par.map(f=>sc(f.post)-sc(f.pre));
  b=`<h3>Comparación inicial y final</h3>${buscador()}${T(["Código","Inicial","Final","Cambio"],rows.concat([AV(["Promedio",avg(F.map(f=>sc(f.pre))),avg(F.map(f=>sc(f.post))),dif.length?(avg(dif)>0?"+":"")+avg(dif):"–"])]))}
  <p class="step">El cambio promedio se calcula solo con quienes hicieron las dos evaluaciones (${par.length}).</p><div class="bt">${cbtn("comp","Copiar comparación","s")}<p class="step">Tabla con encabezados, para revisar o pegar en una hoja aparte.</p></div>`}
 return `<div class="card"><h2>Conocimientos</h2>${sub([["pre","Evaluación inicial"],["post","Evaluación final"],["comp","Comparación"]])}${b}</div>`}

/* ---------- HÁBITOS ---------- */
function vHab(){const L=flt(),N=["Agua","Lonchera","Juego","Pantallas"];let b="";
 if(SUB=="all"){b=`<h3>Las 4 semanas juntas</h3>${buscador()}${T(["Código"].concat([1,2,3,4].flatMap(s=>N.map(x=>"S"+s+" "+x))),L.map(f=>{let r=[f.codigo];for(let s=1;s<=4;s++)r=r.concat(hab(f,s)||["–","–","–","–"]);return r}))}
  <div class="bt">${cbtn("hab","Copiar hábitos semanas 1 a 4")}<p class="step">Hoja de Hábitos, celda <b>A6</b> (código + 16 columnas). Incluye a todos en el mismo orden.</p></div>`}
 else{const s=+SUB||1,env=F.filter(f=>hab(f,s));
  b=`<h3>Semana ${s}</h3>${buscador()}<p class="step">Días (de 0 a 7) en que se cumplió cada hábito. Enviaron: ${env.length} de ${F.length}.</p>${T(["Código"].concat(N),L.map(f=>[f.codigo].concat(hab(f,s)||["–","–","–","–"])).concat(env.length?[AV(["Promedio"].concat(N.map((_,i)=>avg(env.map(f=>hab(f,s)[i])))))]:[]))}`}
 return `<div class="card"><h2>Hábitos semanales</h2>${sub([["1","Semana 1"],["2","Semana 2"],["3","Semana 3"],["4","Semana 4"],["all","Todas (para Excel)"]])}${b}</div>`}

/* ---------- SATISFACCIÓN ---------- */
function vSat(){const L=flt(),con=F.filter(f=>f.sat);
 return `<div class="card"><h2>Encuesta de satisfacción</h2>${buscador()}<p class="step">Valoraciones de 1 a 5. Respondieron ${con.length} de ${F.length}.</p>
 ${T(["Código","Utilidad","Claridad","Recomendaría","Comentario"],L.map(f=>{const s=f.sat||[];return[f.codigo,dash(s[0]),dash(s[1]),dash(s[2]),{h:s[3]?`<span style="white-space:normal;display:inline-block;min-width:220px;text-align:left">${esc(s[3])}</span>`:"–"}]}).concat(con.length?[AV(["Promedio",avg(con.map(f=>f.sat[0])),avg(con.map(f=>f.sat[1])),avg(con.map(f=>f.sat[2])),""])]:[]))}
 <div class="bt">${cbtn("sat","Copiar satisfacción")}<p class="step">Hoja de Satisfacción, celda <b>A6</b> (código, 3 valoraciones y comentario).</p></div></div>`}

/* ---------- RECORDATORIOS ---------- */
const base=()=>location.href.replace(/panel-tesis\.html.*$/,"");
const MSG={1:"ya está abierta la Semana 1: Agua primero. Ingrese, responda la evaluación inicial (unos 5 minutos) y comience con la lección y el reto.",
2:"ya está disponible la Semana 2: Lonchera arcoíris. Ingrese para ver el nuevo contenido y registrar su semana.",
3:"ya está disponible la Semana 3: Familia en movimiento. Ingrese para ver el reto y registrar su semana.",
4:"ya está disponible la Semana 4: Cocinamos juntos, la última semana. Ingrese, registre su semana y complete la evaluación final y la encuesta para recibir su certificado."};
const pend=(f,n)=>n==1?!(f.pre&&hab(f,1)):n==4?!(hab(f,4)&&f.post&&f.sat):!hab(f,n);
const tel=w=>{let d=(w||"").replace(/\D/g,"");if(!d)return"";if(d.startsWith("593"))return d;if(d.startsWith("0"))d=d.slice(1);return"593"+d};
const texto=(n,f)=>`${f&&f.nombre?"Estimado/a "+f.nombre:"Estimada familia de Surcos"}: ${MSG[n]}${f?` Su código: ${f.codigo}.`:""} Enlace: ${base()}`;
const L2=()=>F.filter(f=>!RP||pend(f,RW));
let GAS="",ESTADO={},RES="",FORZAR=false,OCUP=false,VK="";
try{GAS=localStorage.getItem("surcos_gas")||""}catch(e){}
const clv=()=>RW+"|"+RP+"|"+FORZAR;
function guardarGas(){const v=$("#gas").value.trim();
 if(v&&!/^https:\/\/script\.google\.com\/.+\/exec$/.test(v)){RES='<div class="err">El enlace debe empezar con https://script.google.com/ y terminar en /exec.</div>';return render()}
 GAS=v;try{localStorage.setItem("surcos_gas",v)}catch(e){}RES="";VK="";ESTADO={};cargarEstado();render()}
async function gas(o){if(!GAS)throw new Error("Falta el enlace del script de Google.");let r;
 try{r=await fetch(GAS,{method:"POST",body:JSON.stringify(Object.assign({clave:CLAVE},o))})}catch(e){throw new Error("No se pudo conectar con el script de Google. Revise el enlace y su internet.")}
 let d;try{d=await r.json()}catch(e){throw new Error("Respuesta no válida del script. Revise que esté implementado como aplicación web con acceso para “Cualquier persona”.")}
 if(!d.ok)throw new Error(d.error||"Error del script");return d}
async function cargarEstado(){if(!GAS)return;try{const d=await gas({accion:"estado"});ESTADO=d.log||{};if(TAB=="rec")render()}catch(e){}}
function resumen(d,acc){const o=d.omitidos||{},n=x=>esc(x==null?0:x),
 om=`${n(o.completaron)} ya completaron · ${n(o.yaEnviado)} ya recibieron este aviso · ${n(o.reciente)} recibieron otro correo hace menos de ${n(d.diasMin)} días · ${n(o.sinCorreo)} sin correo`;
 const tipo=d.tipo=="pendientes"?"solo pendientes":"aviso a todos",sim=d.simulado?'<p class="step"><b>Modo simulación activo en el script</b> (SIMULAR: true): no se envía ni se anota nada.</p>':"";
 if(acc=="vista")return `<div class="res">Se enviarían <b>${n(d.aEnviar)}</b> correos · Semana ${n(d.semana)} · ${tipo}.</div><p class="step">Se omiten: ${om}.</p>${sim}<p class="step">Cuota diaria restante de Gmail: ${n(d.cuota)}.</p>`;
 return `<div class="res">${d.simulado?"SIMULACIÓN · se habrían enviado":"Correos enviados"}: <b>${n(d.enviados)}</b> · Semana ${n(d.semana)} · ${tipo}.</div>${(d.fallidos||[]).length?`<div class="err">No se pudo enviar a: ${d.fallidos.map(esc).join(", ")}</div>`:""}${d.cuotaAgotada?'<div class="err">Se alcanzó la cuota diaria de Gmail. El resto quedó sin enviar; vuelva a intentarlo mañana (no se duplicarán los ya enviados).</div>':""}<p class="step">Se omitieron: ${om}.</p>${sim}`}
async function envio(acc){if(OCUP)return;
 if(acc=="enviar"&&!confirm("¿Enviar ahora los correos de la Semana "+RW+"? Esta acción no se puede deshacer."))return;
 OCUP=true;RES='<p class="step">Procesando…</p>';render();
 try{const d=await gas({accion:acc,semana:RW,soloPendientes:RP,forzar:FORZAR});RES=resumen(d,acc);VK=acc=="vista"&&d.aEnviar>0?clv():"";if(acc=="enviar"){VK="";await cargarEstado()}}
 catch(e){RES=`<div class="err">${esc(e.message)}</div>`;VK=""}
 OCUP=false;render()}
function vRec(){const n=RW,L=L2(),s=SEM.find(x=>x.numero==n),ult=f=>{const e=ESTADO[f.codigo];return e&&e.u?fecha(e.u+"T12:00:00"):(GAS?"Nunca":"–")},ok=VK&&VK==clv();
 return `<div class="card"><h2>Recordatorios semanales</h2><p class="step">Elija la semana y marque “solo pendientes” para escribir únicamente a quienes aún no completaron esa semana. Esta selección vale para el correo y para el WhatsApp.${s?` Semana ${n}: abre el ${esc(s.fecha_apertura)} y cierra el ${esc(s.fecha_cierre)}.`:""}</p>
 <label>Semana: <select onchange="RW=+this.value;VK='';RES='';render()">${[1,2,3,4].map(i=>`<option value="${i}" ${i==n?"selected":""}>Semana ${i}</option>`).join("")}</select></label>
 <label style="margin-left:14px"><input type="checkbox" ${RP?"checked":""} onchange="RP=this.checked;VK='';RES='';render()"> Solo pendientes</label></div>
 <div class="card"><h2>📧 Envío por correo desde su Gmail</h2>
 ${GAS?`<p class="step">Se enviará a las familias de la <b>Semana ${n}</b>: ${RP?"las que aún no la completaron":"todas (aviso de que la semana está disponible)"}. El script no repite el mismo aviso en la misma semana ni escribe a quien recibió un correo hace menos de 2 días.</p>
 <label style="font-weight:normal"><input type="checkbox" ${FORZAR?"checked":""} onchange="FORZAR=this.checked;VK='';RES='';render()"> Reenviar aunque ya se haya enviado este aviso o se haya escrito hace poco</label>${FORZAR?'<p class="step" style="color:#9b1c1c">Atención: así se puede repetir el correo a familias que ya lo recibieron.</p>':""}
 <button ${OCUP?"disabled":""} onclick="envio('vista')">1. Ver a quiénes se enviaría</button>${ok?`<button ${OCUP?"disabled":""} onclick="envio('enviar')">2. Confirmar y enviar</button>`:""}`
 :`<p class="step">Aún no hay un script de Google conectado. Pegue abajo el enlace de la aplicación web para activar el envío por correo.</p>`}
 <div>${RES}</div>
 <details ${GAS?"":"open"}><summary style="cursor:pointer;font-size:13px;color:var(--g)">Enlace del script de Google</summary>
 <p class="step">En Apps Script: Implementar → Nueva implementación → Aplicación web → ejecutar como “Yo”, acceso “Cualquier persona”. Copie el enlace que termina en /exec.</p>
 <input id="gas" type="url" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(GAS)}" style="width:100%;max-width:560px"><br><button class="s" onclick="guardarGas()">Guardar enlace</button></details></div>
 <div class="card"><h2>💬 WhatsApp y lista de familias</h2>
 <p class="step"><b>Mensaje:</b> ${esc(texto(n,null))}</p>
 <button onclick="navigator.clipboard.writeText(texto(RW,null)).then(()=>this.nextElementSibling.textContent='Copiado ✓')">Copiar mensaje</button><span class="ok"></span>
 <button class="s" onclick="navigator.clipboard.writeText(L2().map(f=>f.correo).filter(Boolean).join(', ')).then(()=>this.nextElementSibling.textContent='Copiado ✓')">Copiar correos (${L.filter(f=>f.correo).length})</button><span class="ok"></span>
 <p class="step">Si envía correos a mano, péguelos en el campo <b>CCO</b> (copia oculta). Los WhatsApp se abren en su aplicación y usted los envía.</p>
 ${T(["Código","Nombre","Estado","Último aviso por correo","WhatsApp","Correo"],L.map(f=>[f.codigo,dash(f.nombre),{h:pend(f,n)?'<span class="pill w">Pendiente</span>':'<span class="pill">Completó ✓</span>'},ult(f),{h:tel(f.whatsapp)?`<a href="https://wa.me/${tel(f.whatsapp)}?text=${encodeURIComponent(texto(n,f))}" target="_blank" rel="noopener">Enviar WhatsApp</a>`:"–"},dash(f.correo)]),"Nadie pendiente en esta semana.")}</div>`}

login();
</script></body></html>
